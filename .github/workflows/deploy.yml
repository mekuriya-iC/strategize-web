name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted # Use your self-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build Docker image
        run: |
          docker build -t strategize-web:latest \
          --build-arg NODE_ENV=production \
          .

      - name: Stop and Remove Old Containers
        run: |
          CONTAINERS=$(docker ps -a -q --filter name=strategize-web)
          if [ -n "$CONTAINERS" ]; then
            docker stop $CONTAINERS
            docker rm $CONTAINERS
          fi

      - name: Remove Old Images
        run: |
          docker images -q --filter "dangling=true" strategize-web | xargs -I {} docker rmi -f {} || true

      - name: Run New Container
        run: |
          fuser -k 4410/tcp || true
          docker run -d --network host -p 4410:4410 strategize-web:latest
